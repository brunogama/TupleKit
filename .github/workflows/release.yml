---
name: Release

'on':
  workflow_run:
    workflows: [Swift]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: >-
    release-${{ github.event_name == 'workflow_run' && 'main' ||
    inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      !github.event.deleted &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: macos-latest
    steps:
      - name: Resolve release ref
        id: ref
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            echo 'checkout=refs/heads/main' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          component='(0|[1-9][0-9]*)'
          if ! [[ "$TAG" =~ ^v$component\.$component\.$component$ ]]; then
            echo 'Expected a stable vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
          checkout="refs/tags/$TAG"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            checkout="$GITHUB_SHA"
          fi
          printf 'checkout=%s\ntag=%s\n' "$checkout" "$TAG" >> "$GITHUB_OUTPUT"

      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.ref.outputs.checkout }}
          fetch-depth: 0
          persist-credentials: false

      # A newer push to main gets its own run, which releases these commits too.
      - name: Skip when main has moved
        if: github.event_name == 'workflow_run'
        id: current
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved past $TESTED_SHA; the newer run releases instead."
          fi

      - name: Compute the version and changelog
        id: version
        if: steps.current.outputs.current == 'true'
        run: >-
          python3 Scripts/conventional-commits.py release
          --changelog CHANGELOG.md --notes "$RUNNER_TEMP/notes.md"

      # Tags pushed with GITHUB_TOKEN do not start a second workflow run.
      - name: Build binary release assets
        if: >-
          steps.version.outputs.released == 'true' ||
          steps.ref.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag || steps.ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          source .swift-style.env
          shopt -s nullglob
          expected="Xcode $XCODE_VERSION"
          apps=(
            /Applications/Xcode_"${XCODE_VERSION}"*.app
            /Applications/Xcode-"${XCODE_VERSION}"*.app
          )
          for app in "${apps[@]}"; do
            export DEVELOPER_DIR="$app/Contents/Developer"
            reported="$(xcodebuild -version)"
            case "${reported%%$'\n'*}" in
              "$expected"|"$expected".*)
                bash Scripts/build-binary-release.sh "$TAG" \
                  "$GITHUB_REPOSITORY" "$RUNNER_TEMP/binary-release"
                exit 0
                ;;
            esac
          done
          echo "::error::No Xcode ${XCODE_VERSION} on this runner."
          exit 1

      - name: Commit the changelog and push the tag
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git config user.name "github-actions[bot]"
          email='41898282+github-actions[bot]@users.noreply.github.com'
          git config user.email "$email"
          git add CHANGELOG.md
          git commit -m "chore(release): $TAG [skip ci]"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Publish the release and binaries
        if: >-
          steps.version.outputs.released == 'true' ||
          steps.ref.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag || steps.ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG"
          tag_refs="$(git ls-remote --tags origin "$tag_ref" "$tag_ref^{}")"
          tagged_commit="$(awk -v ref="$tag_ref" '
            $2 == ref { direct = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print peeled ? peeled : direct }
          ' <<< "$tag_refs")"
          if [[ "$tagged_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Tag $TAG no longer points to the built commit."
            exit 1
          fi

          cd "$RUNNER_TEMP/binary-release"
          assets=(
            TupleKit.xcframework.zip
            TupleKitComposition.xcframework.zip
            Package.binary.swift
          )
          if existing="$(gh release view "$TAG" --json isDraft,assets \
            --jq '.isDraft, .assets[].name' 2>/dev/null)"; then
            draft="${existing%%$'\n'*}"
            count=0
            for asset in "${assets[@]}"; do
              if grep -Fxq "$asset" <<< "$existing"; then
                count=$((count + 1))
              fi
            done
            if [[ "$count" == "${#assets[@]}" ]]; then
              echo "Release $TAG already contains all binary assets."
            elif [[ "$count" == 0 ]]; then
              gh release upload "$TAG" "${assets[@]}"
            else
              echo "::error::Release $TAG has partial binary assets."
              exit 1
            fi
            if [[ "$draft" == true ]]; then
              gh release edit "$TAG" --draft=false
            fi
            exit 0
          fi

          notes=(--generate-notes)
          if [[ -f "$RUNNER_TEMP/notes.md" ]]; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          fi
          gh release create "$TAG" "${assets[@]}" \
            --title "$TAG" --verify-tag "${notes[@]}"
