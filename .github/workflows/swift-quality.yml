# Managed by provision-swift-quality.sh.
name: Swift quality

on:
  workflow_call:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Swift quality / ${{ matrix.gate }}
    runs-on: macos-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        gate:
          - style
          - analysis

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          source .swift-style.env

          : "${XCODE_VERSION:?Missing XCODE_VERSION}"
          : "${SWIFTLINT_VERSION:?Missing SWIFTLINT_VERSION}"

          # Runner images can name one release Xcode_27.3.app, Xcode_27.3.0.app,
          # or Xcode_27.3_beta.app. Accept those forms, then verify the version.
          shopt -s nullglob
          candidates=(
            "/Applications/Xcode_${XCODE_VERSION}.app"
            /Applications/Xcode_"${XCODE_VERSION}"[._-]*.app
            /Applications/Xcode-"${XCODE_VERSION}"*.app
          )
          developer_dir=""
          for app in "${candidates[@]}"; do
            if [[ -d "$app/Contents/Developer" ]]; then
              developer_dir="$app/Contents/Developer"
              break
            fi
          done

          if [[ -z "$developer_dir" ]]; then
            echo "::error::No Xcode ${XCODE_VERSION} on this runner."
            echo "Available Xcode applications:"
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print
            exit 1
          fi

          # Avoid head under pipefail, which can turn xcodebuild's SIGPIPE into failure.
          reported="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version)"
          reported="${reported%%$'\n'*}"
          if [[ "$reported" != "Xcode ${XCODE_VERSION}" && "$reported" != "Xcode ${XCODE_VERSION}."* ]]; then
            echo "::error::$developer_dir reports $reported, expected Xcode ${XCODE_VERSION}"
            exit 1
          fi

          echo "Using $developer_dir ($reported)"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Install pinned SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          source .swift-style.env

          package="$RUNNER_TEMP/SwiftLint.pkg"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$package" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/SwiftLint.pkg"

          sudo installer -pkg "$package" -target /

          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          swiftlint version

      - name: Validate script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n Scripts/swift-style
          bash -n Scripts/swift-style-analyze

      - name: Check complete Swift style scope
        if: matrix.gate == 'style'
        shell: bash
        run: bash Scripts/swift-style check --all

      - name: Clean build, test, and analyze Swift package
        if: matrix.gate == 'analysis'
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f Package.swift ]]; then
            echo "::error::Replace this step with your Xcode project's clean build and test commands."
            exit 1
          fi

          scratch="$RUNNER_TEMP/swift-analysis-build"
          test_scratch="$RUNNER_TEMP/swift-analysis-tests"
          log="$RUNNER_TEMP/swift-compiler.log"

          swift build \
            --scratch-path "$scratch" \
            --verbose \
            2>&1 | tee "$log"

          swift test \
            --scratch-path "$test_scratch" \
            --verbose \
            2>&1 | tee -a "$log"

          bash Scripts/swift-style-analyze "$log"

      - name: Verify tracked files were not modified
        shell: bash
        run: git diff --exit-code

      - name: Upload compiler log
        if: always() && matrix.gate == 'analysis'
        uses: actions/upload-artifact@v4
        with:
          name: swift-analysis-compiler-log
          path: ${{ runner.temp }}/swift-compiler.log
          if-no-files-found: ignore
          retention-days: 7
