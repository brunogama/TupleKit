name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    uses: ./.github/workflows/swift-quality.yml
    permissions:
      contents: read

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - &select-xcode
      name: Select pinned Xcode
      shell: bash
      run: |
        set -euo pipefail
        source .swift-style.env
        shopt -s nullglob
        for app in /Applications/Xcode_"${XCODE_VERSION}"*.app /Applications/Xcode-"${XCODE_VERSION}"*.app; do
          reported="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version)"
          reported="${reported%%$'\n'*}"
          if [[ "$reported" == "Xcode ${XCODE_VERSION}" || "$reported" == "Xcode ${XCODE_VERSION}."* ]]; then
            echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
            exit 0
          fi
        done
        echo "::error::No Xcode ${XCODE_VERSION} on this runner."
        exit 1
    - name: Show toolchain
      run: swift --version
    - name: Test
      run: swift test
      env:
        # Fail on a missing or changed golden snapshot instead of recording one.
        SNAPSHOT_TESTING_RECORD: never
    - name: Release build
      run: swift build -c release
    - name: Compiler contracts
      run: Scripts/check-compiler-contracts.sh
    - name: Documentation snippets
      run: python3 Scripts/check-doc-snippets.py --run
    - name: iOS 17 products
      run: |
        xcodebuild -scheme TupleKit -destination generic/platform=iOS IPHONEOS_DEPLOYMENT_TARGET=17.0 CODE_SIGNING_ALLOWED=NO build
        xcodebuild -scheme TupleKitComposition -destination generic/platform=iOS IPHONEOS_DEPLOYMENT_TARGET=17.0 CODE_SIGNING_ALLOWED=NO build
    - name: Generated code and golden snapshots
      run: |
        python3 Scripts/generate-concatenation.py --check
        python3 Scripts/check-golden-snapshots.py
    - name: Tooling and executable documentation regressions
      run: python3 -m unittest discover -s Scripts -p 'test_*.py'

  linux:
    runs-on: ubuntu-latest
    container: swift:6.4.2
    steps:
    - uses: actions/checkout@v4
    - name: Install documentation checker runtime
      run: |
        apt-get update
        apt-get install -y --no-install-recommends python3
    - name: Show toolchain
      run: swift --version
    - name: Test
      run: swift test
      env:
        # Fail on a missing or changed golden snapshot instead of recording one.
        SNAPSHOT_TESTING_RECORD: never
    - name: Release build
      run: swift build -c release
    - name: Compiler contracts
      run: Scripts/check-compiler-contracts.sh
    - name: Documentation snippets
      run: python3 Scripts/check-doc-snippets.py --run

  # Data races and memory errors. A sanitizer report fails swift test.
  macos-sanitizers:
    runs-on: macos-latest
    env:
      SNAPSHOT_TESTING_RECORD: never
    steps:
    - uses: actions/checkout@v4
    - *select-xcode
    - name: Thread Sanitizer
      run: swift test --sanitize=thread
    - name: Address Sanitizer
      run: swift test --sanitize=address

  # Leak detection is disabled because XCTest leaks in the Swift 6.4.2 Linux runtime.
  linux-sanitizers:
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.2
      options: --cap-add=SYS_PTRACE
    env:
      SNAPSHOT_TESTING_RECORD: never
    steps:
    - uses: actions/checkout@v4
    - name: Address Sanitizer
      run: swift test --sanitize=address
      env:
        ASAN_OPTIONS: detect_leaks=0
    - name: Thread Sanitizer
      run: swift test --sanitize=thread

  coverage:
    runs-on: macos-latest
    env:
      SNAPSHOT_TESTING_RECORD: never
    steps:
    - uses: actions/checkout@v4
    - *select-xcode
    - name: Test with coverage
      run: swift test --enable-code-coverage
    - name: Line coverage gate
      run: python3 Scripts/check-coverage.py --minimum 96
